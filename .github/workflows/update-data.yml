name: Update data

# Rebuilds the dataset and republishes when the upstream Zenodo record changes
# or on manual dispatch. The resulting commit triggers the Pages deploy.
#
# To track a future observing run, update REC and FILES in pipeline/process_data.py.

on:
  schedule:
    - cron: '17 6 * * 1'          # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Run even if the Zenodo record is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check upstream Zenodo record for changes
        id: check
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python - <<'PY'
          import json, os, re, pathlib, urllib.request
          src = pathlib.Path('pipeline/process_data.py').read_text()
          rec = re.search(r'GS_ZENODO_RECORD",\s*"(\d+)"', src).group(1)
          updated = json.load(urllib.request.urlopen(f'https://zenodo.org/api/records/{rec}'))['updated']
          state = pathlib.Path('pipeline/.zenodo_state.json')
          prev = json.loads(state.read_text()).get(rec) if state.exists() else None
          changed = (os.environ.get('FORCE') == 'true') or (prev != updated)
          print(f'record {rec}: prev={prev} now={updated} -> changed={changed}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'changed={str(changed).lower()}\nrec={rec}\nupdated={updated}\n')
          PY

      - name: Build dataset (UMAP on the runner)
        if: steps.check.outputs.changed == 'true'
        env:
          REC: ${{ steps.check.outputs.rec }}
          UPDATED: ${{ steps.check.outputs.updated }}
        run: |
          pip install --quiet -r pipeline/requirements-lock.txt
          python pipeline/process_data.py --out web/data
          python - <<'PY'
          import json, os, pathlib
          s = pathlib.Path('pipeline/.zenodo_state.json')
          d = json.loads(s.read_text()) if s.exists() else {}
          d[os.environ['REC']] = os.environ['UPDATED']
          s.write_text(json.dumps(d, indent=2))
          PY

      - name: Commit, push & trigger deploy
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'gs-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data pipeline/.zenodo_state.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'data: auto-update from Zenodo (record ${{ steps.check.outputs.rec }})'
            git push
            gh workflow run deploy-pages.yml   # GITHUB_TOKEN pushes don't auto-trigger workflows
          fi
